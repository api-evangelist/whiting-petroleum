aid: whiting-petroleum
name: Whiting Petroleum
description: >-
  Whiting Petroleum was an independent oil and gas company engaged in the exploration,
  development, and production of crude oil, natural gas, and natural gas liquids primarily
  in the Williston Basin (Bakken Shale) in North Dakota and Montana. In July 2022,
  Whiting Petroleum merged with Oasis Petroleum to form Chord Energy Corporation,
  which trades on NASDAQ under the ticker symbol CHRD.
